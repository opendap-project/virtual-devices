# The simulator window of virtual devices (rfcs 0007; virtual-devices ADR 0001): a host app that
# shows the device's display, framed by the device itself, with a sidebar of hardware actions.
[workspace]
resolver = "3"
members = ["crates/opendap-rfb", "crates/odap-vdev-view"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"

[workspace.dependencies]
opendap-rfb = { path = "crates/opendap-rfb" }
# The OpenDAP CLI's crates (rfcs 0008): the use cases and adapters `opendap` and OpenDAP Desktop
# run, consumed as published, never from a checkout's sources.
opendap-model = { git = "https://github.com/opendap-project/cli", rev = "cd18046" }
opendap-core = { git = "https://github.com/opendap-project/cli", rev = "cd18046" }
opendap-transport-ssh = { git = "https://github.com/opendap-project/cli", rev = "cd18046" }
opendap-transport-vm = { git = "https://github.com/opendap-project/cli", rev = "cd18046" }
slint = { version = "1.18.1", default-features = false }
slint-build = "1.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
