# Case: the T1's case as the concept's 3D model builds it (t1 docs/concept-art; the "T1 en 3D" model,
# its construction and finishes kept, T1-059): one piece with flat walls and a 0.6 mm bevel, a
# squircle footprint, the faceplate and the back cover inset flush inside a 1 mm lip, and the keys
# on the side walls. The body is the tentative 59.5 x 94.3 x 24 mm of t1 ADR 0003; radii, the bevel
# and the keys' sizes come from the concept model and are set by eye (UNVERIFIED). Millimetres,
# origin at the device centre, x across, y up, z towards the faceplate (T1-021). Only the
# simulator window draws it (odap-vdev frame); it never reaches the device description.
[layer]
kind = "case"
id = "t1-concept-case"
name = "T1 case (concept model)"

[case]
width_mm = 59.5
height_mm = 94.3
thickness_mm = 24.0
# Squircle corners: a superellipse of exponent 3.6 over 1.45 x the radius (the concept model).
radius_mm = 9.0
squircle_n = 3.6
bevel_mm = 0.6
# The rim of the case around the inset faceplate: the faceplate fills the opening it leaves.
lip_mm = 1.0
# Graphite polymer (PC or ABS) with a grip texture (CASE-020, CASE-021).
color = "#2b2d2f"
texture = "grip"

# The keys on the side walls, as seen from the front: where they are along the edge (centre, from
# the device centre), their length, how far they stand out of the wall, their shape and finish.
[[case.keys]]
role = "action"
side = "left"
y_mm = 30.9
length_mm = 13.0
protrusion_mm = 2.06
shape = "disc"
finish = "anodised-orange"

[[case.keys]]
role = "volume-up"
side = "left"
y_mm = 14.7125
length_mm = 11.375
protrusion_mm = 1.45
shape = "half-up"
# One capsule split in two: each half's outer end is the capsule's round cap (the capsule is
# 8.6 mm across, so a 4.3 mm radius), its end at the split flat (the concept model).
cap_radius_mm = 4.3
finish = "satin-silver"
mark = "+"

[[case.keys]]
role = "volume-down"
side = "left"
y_mm = 2.0875
length_mm = 11.375
protrusion_mm = 1.45
shape = "half-down"
cap_radius_mm = 4.3
finish = "satin-silver"
mark = "-"

[[case.keys]]
role = "main"
side = "right"
y_mm = 22.9
length_mm = 15.0
protrusion_mm = 0.85
shape = "pill"
finish = "satin-silver"
# Five crests across the pill, 1.8 mm apart, for touch identification.
ribs = 5
rib_pitch_mm = 1.8
rib_height_mm = 0.29
