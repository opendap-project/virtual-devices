# H3: the touch faceplate of the T1 reference, virtualised: the 320 x 480 portrait panel, its touch
# screen and the four controls with their roles and places. Control positions are the T1 reference
# faceplate's as drawn in the interface mockups (blackbird-ui renders/web/mockups.css) at 0.153 mm per pixel:
# UNVERIFIED against the enclosure. The host keyboard and pointer drive the same roles.
[layer]
kind = "faceplate"
id = "virtual-touch"
name = "Virtual touch faceplate"
connector = "faceplate"

[display]
width_px = 320
height_px = 480
width_mm = 48.96
height_mm = 73.44
shape = "rectangle"
technology = "lcd"
distance = "handheld"

# The touch panel: QEMU's virtio-multitouch reports positions 0 to 32767 on each axis and tracks
# 10 slots (QEMU 11.1 include/ui/input.h, INPUT_EVENT_ABS_MAX and INPUT_EVENT_SLOTS_MAX).
# How the simulator window draws the device around the screen (odap-vdev frame; runner-only, never
# in the device description). Schematic until the case and the faceplate export their geometry:
# the body is T1-032's ideal outline (54 x 85.6 mm), the display is centred in it, the corner
# radii are guesses (UNVERIFIED). Shapes and colours of the controls follow the concept art
# (T1-059): Action an orange disc, Volume + and - two half-capsules, Main a ribbed silver capsule.
[frame]
body_width_mm = 54.0
body_height_mm = 85.6
body_radius_mm = 7.0
display_x_mm = 2.52
display_y_mm = 6.08
display_radius_mm = 1.0
body_color = "#1d2125"
bezel_color = "#0b0c0e"
action_color = "#ff6a2a"
key_color = "#aab0b6"
key_depth_mm = 1.6

[touch]
resolution_x = 32768
resolution_y = 32768
contacts = 10

# kind, role, Linux code, edge, offset and length in mm, and the QEMU key (qcode) that produces the
# code, which only the runner uses. The host keys after the buttons share their roles, so the
# simulator window can be driven from the keyboard.
[[controls]]
role = "action"
kind = "button"
code = "KEY_PLAYPAUSE"
qcode = "audioplay"
edge = "left"
offset_mm = 5.81
length_mm = 12.85
[[controls]]
role = "volume-up"
kind = "rocker-half"
code = "KEY_VOLUMEUP"
qcode = "volumeup"
edge = "left"
offset_mm = 22.03
length_mm = 10.71
[[controls]]
role = "volume-down"
kind = "rocker-half"
code = "KEY_VOLUMEDOWN"
qcode = "volumedown"
edge = "left"
offset_mm = 34.58
length_mm = 10.71
[[controls]]
role = "main"
kind = "button"
code = "KEY_POWER"
qcode = "power"
edge = "right"
offset_mm = 13.77
length_mm = 14.08
[[controls]]
role = "action"
kind = "button"
code = "KEY_SPACE"
qcode = "spc"
edge = "left"
offset_mm = 5.81
length_mm = 12.85
[[controls]]
role = "volume-up"
kind = "button"
code = "KEY_UP"
qcode = "up"
edge = "left"
offset_mm = 22.03
length_mm = 10.71
[[controls]]
role = "volume-down"
kind = "button"
code = "KEY_DOWN"
qcode = "down"
edge = "left"
offset_mm = 34.58
length_mm = 10.71
[[controls]]
role = "main"
kind = "button"
code = "KEY_P"
qcode = "p"
edge = "right"
offset_mm = 13.77
length_mm = 14.08

[qemu]
args = [
  # The panel: the GPU starts at, and prefers, the panel's size, so the window never changes size and
  # odap-shell finds the panel's mode without a kernel option; the firmware
  # does not drive this MMIO GPU (it needs at least 80 x 25 text cells), so boot shows no text.
  "-device", "virtio-gpu-device,xres={display.width_px},yres={display.height_px}",
  "-device", "virtio-multitouch-pci", "-device", "virtio-keyboard-pci",
  # The simulator window's pointer, which odap-shell treats as one finger.
  "-device", "virtio-tablet-pci",
]
