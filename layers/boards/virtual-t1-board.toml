# H1: the board of the virtual T1: the T1 reference board's storage and connectors, with the
# classes QEMU offers in their place (blackbird-os specs, virtual T1). Connectors are named as on
# the T1 board, so faceplates and HATs attach to them by name.
[layer]
kind = "board"
id = "virtual-t1-board"
name = "Virtual T1 board"

[board]
storage_gb = 32

[[connectors]]
name = "faceplate"
[[connectors]]
name = "usb-c"
[[connectors]]
name = "microsd"
[[connectors]]
name = "hat"

[qemu]
args = [
  # Internal storage (eMMC on the T1): fixed PCI address and first in the boot order.
  "-drive", "if=none,id=system,format=qcow2,file={run.disk}",
  "-device", "virtio-blk-pci,drive=system,addr=0x2,bootindex=0",
  # Management link (the cable to a computer): SSH on the host's loopback.
  "-netdev", "user,id=net0,hostfwd=tcp:127.0.0.1:{run.ssh_port}-:22", "-device", "virtio-net-pci,netdev=net0",
  # USB-C in host mode: hot-plugged drives and audio devices (dap-qmp.py usb).
  "-device", "qemu-xhci,id=xhci", "-audiodev", "{host.audio},id=usbsnd",
  # microSD socket, empty until a card is inserted (dap-qmp.py sd).
  "-device", "sdhci-pci", "-drive", "if=none,id=sdcard", "-device", "sd-card,id=sd0,drive=sdcard",
  # Headphone output (the T1's DACs): one generic output to the host's audio.
  "-audiodev", "{host.audio},id=snd0", "-device", "virtio-sound-pci,audiodev=snd0,streams=1",
]
