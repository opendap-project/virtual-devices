# The virtual board's SSH comes only from the developer machine, through QEMU's user-mode
# gateway. The tools and the simulator window open and drop many connections (the CLI's
# readiness probe reads the banner and closes), which OpenSSH's per-source penalties would
# otherwise answer by refusing that address for a while ("Not allowed at this time").
PerSourcePenaltyExemptList 10.0.2.2
