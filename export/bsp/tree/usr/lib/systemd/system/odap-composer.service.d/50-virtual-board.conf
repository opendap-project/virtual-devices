# The virtual board shows the touch indicator (system composer and UI runtime spec §3): a bubble that
# follows the simulator window's pointer and every contact, so a person or a recording can follow
# each touch. On a physical device it is a debug option (/run/opendap/show-touches).
#
# It also runs in the debug UI mode (system SYS-070): the blueprint's references over the real
# interface, and every element drawn as a blueprint. On a physical device it is a debug option
# (/run/opendap/debug-ui).
[Service]
Environment=ODAP_SHOW_TOUCHES=1 ODAP_DEBUG_UI=1
