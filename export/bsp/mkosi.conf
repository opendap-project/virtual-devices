# Virtual board support package: what a Blackbird OS image adds and trims to run on the virtual
# board (blackbird-os OS-004). The build tool includes this directory (toolkit-image odapkit-image:
# mkosi --include=export/bsp); paths are relative to it.
[Content]
ExtraTrees=tree
# The virtual board has no AF_VSOCK device (QEMU on macOS has no vhost-vsock): SSH is on the
# management link, so systemd's generator must not try to expose it over vsock.
KernelCommandLine=systemd.ssh_auto=no

# The initrd carries mkosi-initrd's default set and the drivers of the virtual board's devices,
# which its udev loads as it finds them; every module stays in the root file system.
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=default
        /virtio[_-][a-z]+\.ko
        /qemu_fw_cfg\.ko
        /sdhci-pci\.ko
        /xhci-pci\.ko

# QEMU builds the devicetree at run time: no board's devicetree is needed.
RemoveFiles=/usr/lib/modules/*/dtb
